_format_version: "3.0"
_comment: "IPE Star Trans Deployment — Release 1 Kong routes"

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
      headers: [Authorization, Content-Type, X-Tenant-ID, X-Request-ID]
      credentials: true
      max_age: 3600
  - name: response-transformer
    config:
      add:
        headers:
          - "Strict-Transport-Security:max-age=31536000; includeSubDomains"
  - name: rate-limiting
    config:
      minute: 500
      limit_by: ip
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_database: 2
      fault_tolerant: true

services:
  - name: dpe-auth-public
    url: http://dpe-svc:8001
    routes:
      - name: st-auth-login
        paths: [/api/v1/auth/login, /api/v1/auth/refresh]
        strip_path: false
      - name: st-health
        paths: [/api/v1/health]
        strip_path: false

  - name: dpe-svc
    url: http://dpe-svc:8001
    plugins:
      - name: ipe-tenant-strip
    routes:
      - name: st-auth
        paths: [/api/v1/auth]
        strip_path: false
      - name: st-dashboard
        paths: [/api/v1/dashboard, /api/v1/analytics]
        strip_path: false
      - name: st-demand
        paths: [/api/v1/demand]
        strip_path: false
      - name: st-planner-assist
        paths: [/api/v1/planner-assist]
        strip_path: false
      - name: st-admin
        paths: [/api/v1/admin]
        strip_path: false
      - name: st-outcomes
        paths: [/api/v1/outcomes]
        strip_path: false

  - name: fea-svc
    url: http://fea-svc:8004
    plugins:
      - name: ipe-tenant-strip
    routes:
      - name: st-feasibility
        paths: [/api/v1/feasibility]
        strip_path: false

  - name: res-svc
    url: http://res-svc:8005
    plugins:
      - name: ipe-tenant-strip
    routes:
      - name: st-resolution
        paths: [/api/v1/resolution]
        strip_path: false

  - name: cap-svc
    url: http://cap-svc:8003
    plugins:
      - name: ipe-tenant-strip
    routes:
      - name: st-capacity
        paths: [/api/v1/capacity]
        strip_path: false

  - name: mat-svc
    url: http://mat-svc:8002
    connect_timeout: 30000
    read_timeout: 60000
    plugins:
      - name: ipe-tenant-strip
    routes:
      - name: st-material
        paths: [/api/v1/material]
        strip_path: false

  - name: connector
    url: http://connector:8009
    plugins:
      - name: ipe-tenant-strip
    routes:
      - name: st-sync
        paths: [/api/v1/sync]
        strip_path: false
      - name: st-erp-odoo
        paths: [/api/v1/erp/odoo]
        strip_path: false
      - name: st-admin-odoo-config
        paths: [/api/v1/admin/odoo-config]
        strip_path: false
