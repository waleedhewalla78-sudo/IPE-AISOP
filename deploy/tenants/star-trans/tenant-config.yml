  display_name_ar: "ستار ترانس"
  # Canonical uuid5(NAMESPACE_URL, "ipe://tenant/star-trans") — future Hetzner identity
  canonical_uuid: "6a7281ee-62cb-5a72-8162-d3c573e54877"
  # Lab operational tenant (seed + 28 MOs). Do not replace on lab.
