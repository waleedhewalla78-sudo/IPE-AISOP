# Bootstrap secret placeholders — replace with ExternalSecrets / Vault CSI in production.
# Do not commit real credentials. Create secrets before install:
#   kubectl create secret generic ipe-db-secret --from-literal=url=postgresql+asyncpg://...
apiVersion: v1
kind: Secret
metadata:
  name: ipe-db-secret
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  url: {{ printf "postgresql+asyncpg://%s:%s@postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password .Values.postgresql.auth.database | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ipe-redis-secret
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  url: {{ .Values.redis.url | quote }}
  password: {{ .Values.redis.auth.password | default "" | quote }}
