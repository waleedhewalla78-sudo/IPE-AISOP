# Bootstrap secret placeholders — replace with ExternalSecrets / Vault CSI in production.
# Do not commit real credentials. Create secrets before install:
#   kubectl create secret generic ipe-db-secret --from-literal=url=postgresql+asyncpg://...
apiVersion: v1
kind: Secret
metadata:
  name: ipe-db-secret
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  url: "postgresql+asyncpg://ipe_user:CHANGE_ME@postgresql:5432/ipe"
  password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: ipe-redis-secret
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  url: "redis://:CHANGE_ME@redis:6379/0"
  password: "CHANGE_ME"
