{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: ipe
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: ipe
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "ipe.serviceAccountName" $ }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
          env:
            - name: IPE_SERVICE_NAME
              value: {{ $name | quote }}
            - name: IPE_PORT
              value: {{ $svc.port | quote }}
            - name: IPE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ipe-db-secret
                  key: url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ipe-db-secret
                  key: url
            - name: IPE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ipe-redis-secret
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ipe-redis-secret
                  key: url
            {{- range $key, $val := $.Values.commonEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $svc.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ $svc.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ $svc.healthCheck.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $svc.healthCheck.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "ipe.fullname" $ }}-config
{{- end }}
{{- end }}
