{{- if .Values.global.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ipe.fullname" . }}-api
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: ipe
  {{- with .Values.global.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.global.ingress.host }}
      secretName: {{ .Values.global.ingress.tls.secretName }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: dpe-svc
                port:
                  number: {{ (index .Values.services "dpe-svc").port }}
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service:
                name: dpe-svc
                port:
                  number: {{ (index .Values.services "dpe-svc").port }}
          - path: /api/v1/admin
            pathType: Prefix
            backend:
              service:
                name: dpe-svc
                port:
                  number: {{ (index .Values.services "dpe-svc").port }}
          - path: /api/v1/analytics
            pathType: Prefix
            backend:
              service:
                name: dpe-svc
                port:
                  number: {{ (index .Values.services "dpe-svc").port }}
          - path: /api/v1/dashboard
            pathType: Prefix
            backend:
              service:
                name: dpe-svc
                port:
                  number: {{ (index .Values.services "dpe-svc").port }}
          - path: /api/v1/feasibility
            pathType: Prefix
            backend:
              service:
                name: fea-svc
                port:
                  number: {{ (index .Values.services "fea-svc").port }}
          - path: /api/v1/resolution
            pathType: Prefix
            backend:
              service:
                name: res-svc
                port:
                  number: {{ (index .Values.services "res-svc").port }}
          - path: /api/v1/capacity
            pathType: Prefix
            backend:
              service:
                name: cap-svc
                port:
                  number: {{ (index .Values.services "cap-svc").port }}
          - path: /api/v1/sync
            pathType: Prefix
            backend:
              service:
                name: connector
                port:
                  number: {{ (index .Values.services "connector").port }}
          - path: /api/v1/erp
            pathType: Prefix
            backend:
              service:
                name: connector
                port:
                  number: {{ (index .Values.services "connector").port }}
          - path: /api/v1/material
            pathType: Prefix
            backend:
              service:
                name: mat-svc
                port:
                  number: {{ (index .Values.services "mat-svc").port }}
{{- end }}
