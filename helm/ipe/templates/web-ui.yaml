{{- if .Values.webUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  labels:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: ipe
spec:
  replicas: {{ .Values.webUi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: ipe
    spec:
      serviceAccountName: {{ include "ipe.serviceAccountName" . }}
      containers:
        - name: web-ui
          image: "{{ .Values.global.imageRegistry }}/web-ui:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.webUi.port }}
              name: http
          env:
            {{- range $k, $v := .Values.webUi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.webUi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  labels:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.webUi.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.webUi.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-ui
  minReplicas: {{ .Values.webUi.hpa.minReplicas }}
  maxReplicas: {{ .Values.webUi.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.webUi.hpa.targetCPUUtilization }}
{{- end }}
{{- end }}
