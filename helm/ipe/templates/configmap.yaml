apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ipe.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "ipe.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  ipe-common.env: |
    # IPE Common Environment — Generated by Helm
    # Environment: {{ .Values.global.environment }}

    AUTH_MODE={{ .Values.auth.mode | default "local" }}
    AUTH_PROVIDER={{ .Values.auth.provider | default "local" }}
    IPE_JWT_SIGNING_MODE={{ .Values.auth.jwtMode | default "hs256" }}

    VAULT_ENABLED={{ .Values.vault.enabled | default false }}

    IPE_AUDIT_REQUEST_MIDDLEWARE={{ .Values.audit.enabled | default false }}

    IPE_DB_POOL_SIZE={{ .Values.database.poolSize | default 10 }}
    IPE_DB_MAX_OVERFLOW={{ .Values.database.maxOverflow | default 20 }}

    IPE_CORS_ORIGINS=https://{{ .Values.global.ingress.host }}

    {{- if .Values.kafka.enabled }}
    IPE_KAFKA_BOOTSTRAP_SERVERS={{ include "ipe.kafka.bootstrapServers" . }}
    {{- end }}

    MDR_QUALITY_GATE_THRESHOLD={{ .Values.mdr.threshold | default "0.70" }}

    IPE_RELEASE_PROFILE={{ .Values.releaseProfile | default "full" }}
