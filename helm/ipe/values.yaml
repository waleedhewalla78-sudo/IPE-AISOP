# IPE Helm Values — Base Configuration
# Override with values-prod.yaml or values-release1.yaml

global:
  imageRegistry: ghcr.io/waleedhewalla78-sudo/ipe
  imagePullPolicy: IfNotPresent
  imageTag: "v9.4.0-p3"
  environment: "production"
  defaultTenantId: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
  defaultTenantName: "default"
  nameOverride: ""
  fullnameOverride: ""
  ingress:
    enabled: true
    className: "nginx"
    host: "ipe.example.com"
    tls:
      enabled: true
      secretName: "ipe-tls-secret"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  monitoring:
    enabled: true

releaseProfile: "full"

auth:
  mode: "keycloak"
  provider: "keycloak"
  jwtMode: "rs256"

audit:
  enabled: true

database:
  poolSize: 10
  maxOverflow: 20

mdr:
  threshold: "0.70"

postgresql:
  enabled: true
  image: postgres:16-alpine
  auth:
    database: ipe
    username: ipe_user
    existingSecret: ipe-db-secret
  primary:
    resources:
      requests: { memory: "512Mi", cpu: "250m" }
      limits: { memory: "2Gi", cpu: "1000m" }
    persistence:
      enabled: true
      size: "20Gi"
      storageClass: "standard"
  readReplicas:
    enabled: false
    replicaCount: 1

redis:
  enabled: true
  image: redis:7-alpine
  auth:
    enabled: true
    existingSecret: ipe-redis-secret
  master:
    resources:
      requests: { memory: "128Mi", cpu: "100m" }
      limits: { memory: "512Mi", cpu: "500m" }
  persistence:
    enabled: true
    size: "2Gi"
  replica:
    replicaCount: 1

kafka:
  enabled: true
  serviceName: kafka
  controller:
    replicaCount: 3
    persistence:
      enabled: true
      size: "10Gi"

kong:
  enabled: true
  ingressController:
    enabled: true
  proxy:
    type: LoadBalancer

