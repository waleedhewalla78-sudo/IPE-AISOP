    enabled: true
    replicaCount: 2
    port: 8001
    resources:
      requests: { memory: "256Mi", cpu: "200m" }
      limits: { memory: "1Gi", cpu: "1000m" }
    env: {}
    healthCheck:
      enabled: true
      path: /api/v1/health
      initialDelaySeconds: 15
      periodSeconds: 10
    hpa:
