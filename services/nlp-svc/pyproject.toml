[project]
name = "ipe-nlp-svc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.49.0", "fastavro>=1.12.2", "ipe-shared>=0.1.0", "sse-starlette>=2.1.0"]

[tool.uv.sources]
ipe-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [ "unit", "integration", "slow" ]
[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
[tool.coverage.report]
fail_under = 75  # P8 v7.0.0 gate
show_missing = true
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["app", "tests"]
[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "T20", "SIM", "TCH", "RUF"]
ignore = ["S101"]
[tool.ruff.lint.isort]
known-first-party = ["ipe_shared", "app"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]


