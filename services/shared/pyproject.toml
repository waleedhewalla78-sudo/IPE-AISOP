[project]
name = "ipe-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "aiokafka>=0.11.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.64b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "sentry-sdk>=2.15.0",
    "python-json-logger>=2.0.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "fastavro>=1.12.2",
    "hvac>=2.3.0",
    "minio>=7.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires database/kafka)",
    "slow: Tests that take >5 seconds",
]

[tool.coverage.run]
source = ["ipe_shared"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 40  # Temporarily lowered to 40% for unit tests. Integration tests (requiring DB/Kafka/Redis) will raise this to 85% in CI.
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["ipe_shared", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "T20", "SIM", "TCH", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ipe_shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
exclude = [
    ".*\\.pyc$",
    ".venv/",
    "tests/",
    "migrations/",
]
