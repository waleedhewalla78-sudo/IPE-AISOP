_format_version: "3.0"
_transform: true

services:
  - name: dpe-svc
    host: dpe-svc
    port: 8001
    protocol: http
    routes:
      - name: dpe-route
        paths:
          - /api/v1/demand
          - /api/v1/signals
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: rate-limiting
            config:
              minute: 100
              policy: local
              limit_by: consumer
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Tenant-ID:$(jwt.payload.tenant_id)"

