apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-pressure
  namespace: ipe-platform
spec:
  mode: one
  selector:
    namespaces:
      - ipe-platform
    labelSelectors:
      app: dpe-svc
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: "120s"
  scheduler:
    cron: "@every 24h"
