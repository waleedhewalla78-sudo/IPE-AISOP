# IPE SLA Alerting Rules

groups:
  - name: ipe-sla-rules
    interval: 30s
    rules:

      # --- SLAs verified in Phase 5 Load Testing ---

      - alert: IPEHighErrorRate
        expr: |
          sum by (service) (
            rate(http_requests_errors_total[5m])
          )
          /
          sum by (service) (
            rate(http_requests_total[5m])
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "{{ $labels.service }} error rate exceeds 1% threshold"
          description: "HTTP error rate for {{ $labels.service }} is {{ $value | humanizePercentage }} (threshold: 1%) over 5 min."
          runbook: "docs/runbooks/incident-response.md"

      - alert: IPELatencyBreach
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 2.0
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "{{ $labels.service }} p95 latency exceeds 2s SLA"
          description: "P95 latency for {{ $labels.service }} is {{ $value | humanizeDuration }} (SLA: 2s)."
          runbook: "docs/runbooks/incident-response.md#alert-2-or-tools-solver-timeout"

      - alert: IPEKafkaLag
        expr: |
          kafka_consumer_lag > 1000
        for: 10m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "Kafka consumer lag > 1000 messages for {{ $labels.consumer_group }}"
          description: "Consumer group {{ $labels.consumer_group }} on topic {{ $labels.topic }} has {{ $value }} messages lagging."
          runbook: "docs/runbooks/incident-response.md#alert-1-kafka-consumer-lag--5-minutes"

      - alert: IPESolverTimeout
        expr: |
          or_tools_solver_duration_seconds > 30
        for: 1m
        labels:
          severity: warning
          team: platform-eng
        annotations:
          summary: "OR-Tools solver exceeded 30s in cap-svc"
          description: "Solver execution took {{ $value | humanizeDuration }}. Large MO batch may require increased timeout."
          runbook: "docs/runbooks/incident-response.md#alert-2-or-tools-solver-timeout"

      - alert: IPEMLDrift
        expr: |
          (
            ml_supplier_reliability_mape
            -
            avg_over_time(ml_supplier_reliability_mape[7d])
          ) > 5.0
        for: 30m
        labels:
          severity: warning
          team: core-ai
        annotations:
          summary: "Supplier reliability MAPE increased by > 5% over 7-day window"
          description: "Current MAPE: {{ $value }}%. Threshold exceeded — consider model retraining."
          runbook: "docs/runbooks/tenant-onboarding.md#week-2-ml-model-training--calibration"
