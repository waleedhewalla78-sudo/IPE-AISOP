# IPE Phase 2 — Alertmanager routing
# Set ALERTMANAGER_SLACK_URL in Vault / compose env for Slack delivery.

global:
  resolve_timeout: 5m
  slack_api_url: '${ALERTMANAGER_SLACK_URL}'

route:
  receiver: 'default'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'slack-critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'slack-warning'
      repeat_interval: 4h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://alertmanager:9093/webhook'
  - name: 'slack-critical'
    slack_configs:
      - channel: '#ipe-alerts-critical'
        send_resolved: true
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
  - name: 'slack-warning'
    slack_configs:
      - channel: '#ipe-alerts'
        send_resolved: true
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
