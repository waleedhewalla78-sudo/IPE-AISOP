global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: ipe

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]

  # Release 1 static targets (Kong Admin HTTP SD is not Prometheus-compatible)
  - job_name: ipe-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - dpe-svc:8001
          - fea-svc:8004
          - res-svc:8005
          - cap-svc:8003
          - connector:8009
        labels:
          profile: release1

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Enable when kafka is in the compose profile (full hybrid stack):
  # - job_name: kafka-exporter
  #   static_configs:
  #     - targets: ["kafka-exporter:9308"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
