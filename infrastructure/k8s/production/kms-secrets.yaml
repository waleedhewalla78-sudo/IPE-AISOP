# Argo Rollouts — Canary Strategy
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: dpe-svc-rollout
  namespace: ipe-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dpe-svc
  template:
    metadata:
      labels:
        app: dpe-svc
    spec:
      containers:
        - name: dpe-svc
          image: ipe/dpe-svc:latest
          ports:
            - containerPort: 8001
  strategy:
    canary:
      canaryService: dpe-svc-canary
      stableService: dpe-svc-stable
      analysis:
        templates:
          - templateName: success-rate
        args:
          - name: service-name
            value: dpe-svc-canary.ipe-platform.svc.cluster.local
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - setWeight: 25
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: { duration: 5m }
        - setWeight: 100
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: ipe-platform
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 1m
      count: 5
      successCondition: result[0] >= 0.99
      provider:
        prometheus:
          address: http://prometheus.ipe-platform.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status!~"5.."}[1m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[1m]))
---
# K3s Edge Manifests
apiVersion: v1
kind: Namespace
metadata:
  name: ipe-edge
  labels:
    app.kubernetes.io/part-of: ipe
    edge: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpe-svc-edge
  namespace: ipe-edge
  labels:
    app: dpe-svc
    tier: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dpe-svc
  template:
    metadata:
      labels:
        app: dpe-svc
        tier: edge
    spec:
      containers:
        - name: dpe-svc
          image: ipe/dpe-svc:latest
          ports:
            - containerPort: 8001
          env:
            - name: IPE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ipe-edge-secrets
                  key: database-url
            - name: IPE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ipe-edge-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
