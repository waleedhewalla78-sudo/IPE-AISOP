# BYOK KMS Secrets — External Secrets Operator + AWS Secrets Manager
# When real AWS is available, replace LocalKMSBackend with AWSKMSBackend
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: ipe-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ipe-kms-keys
  namespace: ipe-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: ipe-kms-keys
    creationPolicy: Owner
  data:
    - secretKey: jwt-signing-key
      remoteRef:
        key: ipe/prod/jwt-signing-key
    - secretKey: encryption-key
      remoteRef:
        key: ipe/prod/encryption-key
---
