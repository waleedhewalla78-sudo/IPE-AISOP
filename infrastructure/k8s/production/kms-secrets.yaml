# HPA for all stateless services
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dpe-svc-hpa
  namespace: ipe-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dpe-svc
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
