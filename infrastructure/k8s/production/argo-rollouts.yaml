# Argo Rollouts — Canary Strategy for all critical services
# Requires Argo Rollouts controller installed in cluster
# kubectl apply -f argo-rollouts.yaml

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mat-svc-rollout
  namespace: ipe-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mat-svc
  template:
    metadata:
      labels:
        app: mat-svc
    spec:
      containers:
        - name: mat-svc
          image: ipe/mat-svc:latest
          ports:
            - containerPort: 8002
  strategy:
    canary:
      canaryService: mat-svc-canary
      stableService: mat-svc-stable
      analysis:
        templates:
          - templateName: success-rate
        args:
          - name: service-name
            value: mat-svc-canary.ipe-platform.svc.cluster.local
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - setWeight: 25
        - pause: { duration: 5m }
        - setWeight: 100
---
