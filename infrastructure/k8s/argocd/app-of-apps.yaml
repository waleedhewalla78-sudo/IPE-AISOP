apiVersion: v1
kind: Namespace
metadata:
  name: ipe-platform
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ipe-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anomalyco/ipe
    targetRevision: HEAD
    path: infrastructure/k8s/helm/ipe-platform
    helm:
      valueFiles:
        - values.yaml
      releaseName: ipe-infra
      parameters:
        - name: services.dpe_svc.enabled
          value: "false"
        - name: services.mat_svc.enabled
          value: "false"
        - name: services.cap_svc.enabled
          value: "false"
        - name: services.fea_svc.enabled
          value: "false"
        - name: services.res_svc.enabled
          value: "false"
        - name: services.del_svc.enabled
          value: "false"
        - name: services.nlp_svc.enabled
          value: "false"
        - name: services.rec_svc.enabled
          value: "false"
        - name: services.alert_svc.enabled
          value: "false"
        - name: services.connector.enabled
          value: "false"
        - name: services.frontend.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: ipe-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ipe-services
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anomalyco/ipe
    targetRevision: HEAD
    path: infrastructure/k8s/helm/ipe-platform
    helm:
      valueFiles:
        - values.yaml
      releaseName: ipe-svc
      parameters:
        - name: infrastructure.postgres.enabled
          value: "false"
        - name: infrastructure.kafka.enabled
          value: "false"
        - name: infrastructure.redis.enabled
          value: "false"
        - name: infrastructure.kong.enabled
          value: "false"
        - name: infrastructure.monitoring.prometheus.enabled
          value: "false"
        - name: infrastructure.monitoring.grafana.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: ipe-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  dependsOn:
    - ipe-infrastructure
