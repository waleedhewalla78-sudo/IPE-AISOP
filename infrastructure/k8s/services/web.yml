apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipe-web
  namespace: ipe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipe-web
  template:
    metadata:
      labels:
        app: ipe-web
    spec:
      containers:
        - name: web
          image: ghcr.io/ipe/web:latest
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ipe-web
  namespace: ipe
spec:
  selector:
    app: ipe-web
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
