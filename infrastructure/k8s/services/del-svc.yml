apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipe-del-svc
  namespace: ipe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipe-del-svc
  template:
    metadata:
      labels:
        app: ipe-del-svc
    spec:
      containers:
        - name: del-svc
          image: ghcr.io/ipe/del-svc:latest
          ports:
            - containerPort: 8006
          envFrom:
            - configMapRef:
                name: ipe-config
            - secretRef:
                name: ipe-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ipe-del-svc
  namespace: ipe
spec:
  selector:
    app: ipe-del-svc
  ports:
    - port: 8006
      targetPort: 8006
