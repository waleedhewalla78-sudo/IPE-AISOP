apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  labels:
    {{- include "ipe.labels" . | nindent 4 }}
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: dpe-svc
        url: http://dpe_svc:8002
        routes:
          - name: dpe-route
            paths:
              - /api/v1/demand
        plugins:
          - name: jwt
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: mat-svc
        url: http://mat_svc:8003
        routes:
          - name: mat-route
            paths:
              - /api/v1/material
        plugins:
          - name: jwt
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: cap-svc
        url: http://cap_svc:8004
        routes:
          - name: cap-route
            paths:
              - /api/v1/capacity
        plugins:
          - name: jwt
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: fea-svc
        url: http://fea_svc:8005
        routes:
          - name: fea-route
            paths:
              - /api/v1/feasibility
        plugins:
          - name: jwt
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: res-svc
        url: http://res_svc:8006
        routes:
          - name: res-route
            paths:
              - /api/v1/resolution
        plugins:
          - name: jwt
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: nlp-svc
        url: http://nlp_svc:8008
        routes:
          - name: nlp-route
            paths:
              - /api/v1/copilot
        plugins:
          - name: jwt
          - name: rate-limiting
            config:
              minute: 30
              policy: local
      - name: alert-svc
        url: http://alert_svc:8010
        routes:
          - name: alert-route
            paths:
              - /api/v1/alerts
        plugins:
          - name: jwt
          - name: rate-limiting
            config:
              minute: 100
              policy: local
    consumers:
      - username: ipe-service
        jwt:
          - algorithm: HS256
            key: ipe-service-key
            secret: ipe-service-secret
      - username: tenant-user
        jwt:
          - algorithm: HS256
            key: tenant-user-key
            secret: tenant-user-secret
