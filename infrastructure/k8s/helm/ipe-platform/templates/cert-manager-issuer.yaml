{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.issuerName | default "ipe-letsencrypt" }}
spec:
  acme:
    server: {{ .Values.certManager.acmeServer | default "https://acme-v02.api.letsencrypt.org/directory" }}
    email: {{ required "certManager.email is required" .Values.certManager.email }}
    privateKeySecretRef:
      name: {{ .Values.certManager.issuerName | default "ipe-letsencrypt" }}
    solvers:
      - http01:
          ingress:
            class: {{ .Values.certManager.ingressClass | default "nginx" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ipe-kong-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: ipe-kong-tls
  issuerRef:
    name: {{ .Values.certManager.issuerName | default "ipe-letsencrypt" }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.certManager.hosts }}
    - {{ . }}
    {{- end }}
{{- end }}
