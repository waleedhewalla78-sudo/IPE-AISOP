_format_version: "3.0"
_comment: "IPE Kong API Gateway declarative configuration"

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:8082"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-Tenant-ID
        - X-Request-ID
      max_age: 3600
      preflight_continue: false

  - name: rate-limiting
    config:
      minute: 500
      limit_by: ip
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_database: 2
      fault_tolerant: true
      hide_client_headers: false

  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes

