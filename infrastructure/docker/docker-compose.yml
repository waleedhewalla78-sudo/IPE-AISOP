  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ipe-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/ipe_test
      KC_DB_USERNAME: ipe
      KC_DB_PASSWORD: ipe_test_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ../keycloak/realm/ipe-realm.json:/opt/keycloak/data/import/ipe-realm.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  airflow:
    image: apache/airflow:2.9.0
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
      AIRFLOW__WEBSERVER__AUTHENTICATE: 'True'
      AIRFLOW__WEBSERVER__RBAC: 'True'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__CORE__FERNET_KEY: '81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__UNIT_TEST_MODE: 'False'
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ../../infrastructure/airflow/dags:/opt/airflow/dags
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@ipe.ai 2>/dev/null || true && airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    image: apache/airflow:2.9.0
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: '81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs='
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IPE_DATABASE_URL_SYNC: postgresql://ipe:ipe_test_pass@db:5432/ipe_test
    depends_on:
      db:
        condition: service_healthy
      airflow:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ../../infrastructure/airflow/dags:/opt/airflow/dags
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  connector:
    env_file:
      - ipe-common.env
    build:
      context: ../../
      dockerfile: services/connector/Dockerfile
    ports:
      - "8011:8009"
    environment:
      DATABASE_URL: postgresql+asyncpg://ipe:ipe_test_pass@db:5432/ipe_test
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACING_ENABLED: "true"
      OTEL_LOGGING_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_PLUGINS: "bundled,ipe-tenant-strip"
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ../kong/kong.yml:/opt/kong/kong.yml
      - ../kong/plugins/ipe-tenant-strip:/usr/local/share/lua/5.1/kong/plugins/ipe-tenant-strip
    depends_on:
      dpe-svc:
        condition: service_started
      mat-svc:
        condition: service_started
      cap-svc:
        condition: service_started
      fea-svc:
        condition: service_started
      del-svc:
        condition: service_started
      res-svc:
        condition: service_started
      nlp-svc:
        condition: service_started
      rec-svc:
        condition: service_started
      alert-svc:
        condition: service_started
      connector:
        condition: service_started

  migrate:
    build:
      context: ../../
      dockerfile: services/dpe-svc/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://ipe:ipe_test_pass@db:5432/ipe_test
      IPE_DATABASE_URL_SYNC: postgresql://ipe:ipe_test_pass@db:5432/ipe_test
    volumes:
      - ../../migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      [
        "sh",
        "-c",
        "pip install -q alembic psycopg2-binary sqlalchemy && cd /app/migrations && alembic upgrade heads",
      ]
    working_dir: /app

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: ipe-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../otel/collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: ipe-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"

  mlflow:
    image: python:3.12-slim
    container_name: ipe-mlflow
    environment:
      MLFLOW_TRACKING_URI: postgresql://ipe:ipe_test_pass@db:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      db:
        condition: service_healthy
