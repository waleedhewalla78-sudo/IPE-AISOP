_format_version: "3.0"
_comment: "Declarative configuration for Kong Gateway with rate limiting, JWT auth, and tenant header injection"

plugins:
  - name: rate-limiting
    config:
      minute: 300
      hour: 10000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
      limit_by: consumer
    _comment: "Global rate limit: 300/min, 10000/hr per consumer"

  - name: request-transformer
    config:
      remove:
        headers:
          - X-Tenant-ID
    _comment: "Strip client X-Tenant-ID header; Kong injects it from JWT claim"

  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
    _comment: "Generate correlation IDs for distributed tracing"

services:
  - name: dpe-auth-public
    url: http://dpe-svc:8001
    routes:
      - name: dpe-auth-login
        paths:
          - /api/v1/auth/login
        strip_path: false

  - name: dpe-svc
    url: http://dpe-svc:8001
    routes:
      - name: dpe-svc-route
        paths:
          - /api/v1/auth/me
          - /api/v1/dashboard
          - /api/v1/demand
          - /api/v1/dpe
          - /api/v1/edge
          - /api/v1/sop
          - /api/v1/cost-accounting
          - /api/v1/financial
          - /api/v1/ctp
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Tenant-ID: $jwt_claim_tenant_id"

  - name: mat-svc
