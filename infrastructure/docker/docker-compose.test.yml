version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ipe-postgres-test
    environment:
      POSTGRES_USER: ipe
      POSTGRES_PASSWORD: ipe_test_pass
      POSTGRES_DB: ipe_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ipe-redis-test
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: ipe-zookeeper-test
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2182:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ipe-kafka-test
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9093:9092"]

  kong-database:
    image: postgres:16
    container_name: ipe-kong-db-test
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_test_pass
      POSTGRES_DB: kong
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.7
    container_name: ipe-kong-test
    depends_on: [kong-database]
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_test_pass
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-odoo-api:
    build:
      context: ../../services/mock-odoo-api
      dockerfile: Dockerfile
    container_name: ipe-mock-odoo-test
    ports: ["8010:8010"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-services:
    image: alpine
    container_name: ipe-vanity-passthrough
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kong:
        condition: service_healthy
      mock-odoo-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: ipe-prometheus-test
    volumes:
      - ../../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9091:9090"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
