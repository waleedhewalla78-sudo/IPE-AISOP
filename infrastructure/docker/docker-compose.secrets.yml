version: "3.9"

# Production secrets overlay for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up
#
# Sensitive values are loaded from Docker secrets files at runtime,
# NOT from plaintext environment variables. Platform operators must
# create the secret files before deploying:
#
#   echo "sk-ant-xxxxxxxx" | docker secret create ipe_anthropic_api_key -
#
# For local development without Docker Swarm, fallback env vars are used.

secrets:
  ipe_jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  ipe_anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  ipe_database_url:
    file: ./secrets/database_url.txt
  ipe_redis_url:
    file: ./secrets/redis_url.txt
  ipe_kafka_bootstrap_servers:
    file: ./secrets/kafka_bootstrap_servers.txt

services:
  dpe-svc:
    secrets:
      - ipe_jwt_secret_key
      - ipe_database_url
      - ipe_redis_url
      - ipe_kafka_bootstrap_servers
    environment:
      IPE_JWT_SECRET_KEY_FILE: /run/secrets/ipe_jwt_secret_key
      IPE_DATABASE_URL_FILE: /run/secrets/ipe_database_url
      IPE_REDIS_URL_FILE: /run/secrets/ipe_redis_url
      IPE_KAFKA_BOOTSTRAP_SERVERS_FILE: /run/secrets/ipe_kafka_bootstrap_servers

  mat-svc:
    secrets:
      - ipe_jwt_secret_key
      - ipe_database_url
      - ipe_redis_url
    environment:
      IPE_JWT_SECRET_KEY_FILE: /run/secrets/ipe_jwt_secret_key
      IPE_DATABASE_URL_FILE: /run/secrets/ipe_database_url
      IPE_REDIS_URL_FILE: /run/secrets/ipe_redis_url

  cap-svc:
    secrets:
      - ipe_jwt_secret_key
      - ipe_database_url
    environment:
      IPE_JWT_SECRET_KEY_FILE: /run/secrets/ipe_jwt_secret_key
      IPE_DATABASE_URL_FILE: /run/secrets/ipe_database_url

  fea-svc:
    secrets:
      - ipe_jwt_secret_key
      - ipe_database_url
      - ipe_redis_url
      - ipe_kafka_bootstrap_servers
    environment:
      IPE_JWT_SECRET_KEY_FILE: /run/secrets/ipe_jwt_secret_key
      IPE_DATABASE_URL_FILE: /run/secrets/ipe_database_url
      IPE_REDIS_URL_FILE: /run/secrets/ipe_redis_url
      IPE_KAFKA_BOOTSTRAP_SERVERS_FILE: /run/secrets/ipe_kafka_bootstrap_servers

  nlp-svc:
    secrets:
      - ipe_anthropic_api_key
      - ipe_database_url
    environment:
      IPE_ANTHROPIC_API_KEY_FILE: /run/secrets/ipe_anthropic_api_key
      IPE_DATABASE_URL_FILE: /run/secrets/ipe_database_url

  del-svc:
    secrets:
      - ipe_anthropic_api_key
      - ipe_database_url
    environment:
      IPE_ANTHROPIC_API_KEY_FILE: /run/secrets/ipe_anthropic_api_key
      IPE_DATABASE_URL_FILE: /run/secrets/ipe_database_url

  rec-svc:
    secrets:
      - ipe_jwt_secret_key
      - ipe_database_url
      - ipe_kafka_bootstrap_servers
    environment:
      IPE_JWT_SECRET_KEY_FILE: /run/secrets/ipe_jwt_secret_key
      IPE_DATABASE_URL_FILE: /run/secrets/ipe_database_url
      IPE_KAFKA_BOOTSTRAP_SERVERS_FILE: /run/secrets/ipe_kafka_bootstrap_servers

  connector:
    secrets:
      - ipe_jwt_secret_key
      - ipe_database_url
      - ipe_kafka_bootstrap_servers
    environment:
      IPE_JWT_SECRET_KEY_FILE: /run/secrets/ipe_jwt_secret_key
      IPE_DATABASE_URL_FILE: /run/secrets/ipe_database_url
      IPE_KAFKA_BOOTSTRAP_SERVERS_FILE: /run/secrets/ipe_kafka_bootstrap_servers
