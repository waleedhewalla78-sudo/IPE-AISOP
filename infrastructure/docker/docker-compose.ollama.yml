# Ollama overlay — local LLM backbone.
# Usage (must pass profile):
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml -f docker-compose.ollama.yml --profile ollama up -d
#
# Pull model:
#   docker compose ... exec ollama ollama pull llama3.2:3b

services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nlp-svc:
    environment:
      IPE_LLM_PRIMARY_PROVIDER: ollama
      IPE_OLLAMA_ENDPOINT_URL: http://ollama:11434
      IPE_OLLAMA_MODEL: ${IPE_OLLAMA_MODEL:-llama3.2:3b}
      IPE_OPENROUTER_API_KEY: ""
      IPE_ANTHROPIC_API_KEY: ""
    depends_on: !reset
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      dpe-svc:
        condition: service_started
      mat-svc:
        condition: service_started
      cap-svc:
        condition: service_started

volumes:
  ollama_data:
