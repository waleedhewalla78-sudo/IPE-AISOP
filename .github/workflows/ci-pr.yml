name: CI — Pull Request

on:
  pull_request:
    branches: [main, develop, "release/*"]

env:
  UV_LINK_MODE: copy

jobs:
  lint-python:
    name: Lint Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - dpe-svc
          - demand-svc
          - supply-svc
          - scenario-svc
          - cap-svc
          - fea-svc
          - res-svc
          - connector
          - order-svc
          - equipment-svc
          - material-svc
          - procurement-svc
          - nlp-svc
          - alert-svc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: uv sync --frozen
      - name: Ruff check
        working-directory: services/${{ matrix.service }}
        run: uv run ruff check app/
      - name: Type check
        working-directory: services/${{ matrix.service }}
        run: uv run mypy app/ --ignore-missing-imports || true

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test-python:
    name: Test Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint-python
    strategy:
      fail-fast: false
      matrix:
        service:
          - dpe-svc
          - demand-svc
          - supply-svc
          - cap-svc
          - fea-svc
          - res-svc
          - connector
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipe_test
          POSTGRES_USER: ipe
          POSTGRES_PASSWORD: ipe_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ipe -d ipe_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: uv sync --frozen
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          IPE_DATABASE_URL: postgresql+asyncpg://ipe:ipe_test_pass@localhost:5432/ipe_test
          IPE_REDIS_URL: redis://localhost:6379/0
          IPE_JWT_SIGNING_MODE: hs256
          IPE_JWT_SECRET_KEY: ci-test-secret-key-min-32-chars-long!!
          IPE_AUDIT_REQUEST_MIDDLEWARE: "false"
          IPE_VAULT_ENABLED: "false"
          IPE_AUTH_MODE: local
          IPE_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: uv run pytest tests/ -v --tb=short --junitxml=results.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/results.xml

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: apps/web/coverage/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Python SAST (bandit)
        run: |
          pip install bandit
          bandit -r services/shared/ipe_shared/ apps/ -f json -o bandit-report.json || true
          bandit -r services/shared/ipe_shared/ apps/ -f screen
        continue-on-error: true
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          uv sync --frozen
          uv export --frozen --no-dev --no-emit-workspace --no-emit-project -o requirements-audit.txt
          pip-audit -r requirements-audit.txt --desc
        working-directory: services/shared
        continue-on-error: true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
