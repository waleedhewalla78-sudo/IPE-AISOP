name: Deploy to Staging

on:
  push:
    branches: [develop]

concurrency:
  group: cd-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to staging
        run: |
          kubectl set image deployment/ipe-dpe-svc dpe-svc=${{ env.REGISTRY }}/ipe/dpe-svc:${{ env.IMAGE_TAG }} -n ipe
